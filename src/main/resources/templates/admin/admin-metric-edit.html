<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Редактирование показателя')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">

    <a th:href="@{/admin/info-center}" class="btn btn-link mb-2">← Назад</a>

    <h1 class="mb-4">Редактирование показателя</h1>

    <form th:action="@{/admin/info-center/metric/{id}/edit(id=${metric.id})}" method="post">
        <div class="mb-3">
            <label class="form-label">Название</label>
            <input type="text" name="metricName" class="form-control"
                   th:value="${metric.metricName}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Единица измерения</label>
            <input type="text" name="unit" class="form-control"
                   th:value="${metric.unit}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Min (необязательно)</label>
            <input type="number" step="0.1" name="minValue" class="form-control"
                   th:value="${metric.minValue}">
        </div>
        <div class="mb-3">
            <label class="form-label">Max (необязательно)</label>
            <input type="number" step="0.1" name="maxValue" class="form-control"
                   th:value="${metric.maxValue}">
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>

</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
