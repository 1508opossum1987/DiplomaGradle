<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Значения показателя')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">

    <a th:href="@{/admin/info-center}" class="btn btn-link mb-2">← Назад</a>

    <h1 class="mb-4">
        Значения показателя «<span th:text="${metric.metricName}">Травматизм</span>»
        (<span th:text="${metric.unit}">случай</span>)
    </h1>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Добавить значение</h5>
            <form th:action="@{/admin/info-center/metric/{id}/values(id=${metric.id})}" method="post" class="row g-2">
                <div class="col-auto">
                    <label class="form-label">Год</label>
                    <input type="number" name="year" class="form-control" min="2024" required>
                </div>
                <div class="col-auto">
                    <label class="form-label">Месяц</label>
                    <input type="number" name="month" class="form-control" min="1" max="12" required>
                </div>
                <div class="col-auto">
                    <label class="form-label">План</label>
                    <input type="number" step="0.1" name="plan" class="form-control">
                </div>
                <div class="col-auto">
                    <label class="form-label">Факт</label>
                    <input type="number" step="0.1" name="fact" class="form-control">
                </div>
                <div class="col-auto align-self-end">
                    <button type="submit" class="btn btn-primary">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-striped table-fixed">
        <colgroup>
            <col style="width: 70px;">
            <col style="width: 70px;">
            <col style="width: 110px;">
            <col style="width: 110px;">
            <col style="width: 160px;">
            <col style="width: 160px;">
            <col style="width: 200px;">
        </colgroup>
        <thead>
        <tr>
            <th>Год</th>
            <th>Месяц</th>
            <th class="text-end">План</th>
            <th class="text-end">Факт</th>
            <th>Кто изменил</th>
            <th>Когда</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="value : ${values}">
            <td th:text="${value.year}">2026</td>
            <td th:text="${value.month}">10</td>
            <td class="num-cell" th:text="${value.plan != null ? #numbers.formatDecimal(value.plan, 1, 1) : '—'}">0.0</td>
            <td class="num-cell" th:text="${value.fact != null ? #numbers.formatDecimal(value.fact, 1, 1) : '—'}">0.0</td>
            <td th:text="${value.updatedBy != null ? value.updatedBy : '—'}">system</td>
            <td th:text="${value.updatedAt != null ? #temporals.format(value.updatedAt, 'dd:MM:yyyy HH:mm') : '—'}">01:10:2026 12:00</td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/admin/info-center/metric/{mid}/values/{vid}/edit(mid=${metric.id}, vid=${value.id})}">
                    Редактировать
                </a>
                <form th:action="@{/admin/info-center/metric/{mid}/values/{vid}/delete(mid=${metric.id}, vid=${value.id})}"
                      method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Удалить значение?')">Удалить</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(values)}">
            <td colspan="7" class="text-center text-muted">Значений нет</td>
        </tr>
        </tbody>
    </table>

</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
