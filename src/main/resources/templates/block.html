<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${block.title()})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">

    <a th:href="@{/}" class="btn btn-link mb-2">← На главную</a>

    <div class="block-card mb-4" th:classappend="${block.colorClass()}">
        <h1 class="mb-0" th:text="${block.title()}">Безопасность</h1>
    </div>

    <form class="row g-2 align-items-end mb-4" method="get"
          th:action="@{/block/{id}(id=${block.id()})}">
        <div class="col-auto">
            <label class="form-label">Год</label>
            <input type="number" class="form-control" name="year" th:value="${year}" min="2024">
        </div>
        <div class="col-auto">
            <label class="form-label">Месяц</label>
            <input type="number" class="form-control" name="month" th:value="${month}" min="1" max="12">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Показать</button>
        </div>
    </form>

    <table class="table table-striped table-fixed">
        <colgroup>
            <col style="width: 45%;">
            <col style="width: 120px;">
            <col style="width: 130px;">
            <col style="width: 130px;">
            <col style="width: 130px;">
        </colgroup>
        <thead>
        <tr>
            <th>Показатель</th>
            <th>Ед. изм.</th>
            <th class="text-end">План</th>
            <th class="text-end">Факт</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="metric : ${block.metrics()}">
            <td th:text="${metric.name()}">Травматизм</td>
            <td th:text="${metric.unit()}">случай</td>
            <td class="num-cell" th:text="${metric.plan() != null ? #numbers.formatDecimal(metric.plan(), 1, 1) : '—'}">0.0</td>
            <td class="num-cell" th:text="${metric.fact() != null ? #numbers.formatDecimal(metric.fact(), 1, 1) : '—'}">0.0</td>
            <td class="text-end">
                <a class="btn btn-outline-primary btn-sm"
                   th:href="@{/metric/{id}(id=${metric.id()})}">Подробнее</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
