<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Регистрация')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 500px; margin-top: 60px;">

    <h1 class="mb-4 text-center">Регистрация</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">
        Ошибка регистрации
    </div>

    <form method="post" th:action="@{/register}">
        <div class="mb-3">
            <label class="form-label">Логин</label>
            <input type="text" class="form-control" name="username" required
                   th:value="${username}" minlength="4" maxlength="20"
                   pattern="[a-zA-Z0-9_.-]+">
        </div>
        <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" class="form-control" name="password" required
                   minlength="4" maxlength="20">
        </div>
        <div class="mb-3">
            <label class="form-label">Имя (ФИО)</label>
            <input type="text" class="form-control" name="name" required
                   th:value="${name}" minlength="4" maxlength="20">
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required
                   th:value="${email}" maxlength="40">
        </div>
        <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
    </form>

    <div class="text-center mt-3">
        <a th:href="@{/login}">Уже есть аккаунт? Войти</a>
    </div>

</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
